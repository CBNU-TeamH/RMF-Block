services:
  app:
    build: .
    container_name: rmf-app
    ports:
      - "3000:3000"
    # The app's own state (ADR-002) — chat, and the workspace/auth records that
    # follow it. Without this it lives in the container's writable layer and a
    # `down` or an `up --build` takes it, while Mongo beside it survives.
    #
    # A *named* volume, not a bind mount: the Dockerfile creates /app/.data and
    # chowns it to `node` because everything else is COPYed in as root. An empty
    # named volume seeds itself from the image, ownership included; a bind mount
    # would overlay the host directory's ownership instead and the first write
    # would fail as EACCES.
    volumes:
      - app-data:/app/.data
    environment:
      # The container sees Docker's network, not the LAN, so it cannot work out
      # the address guests type in. Startup says so and prints how to find it —
      # then either `HOST_LAN_IP=192.168.0.14 docker compose up` or put the same
      # line in a `.env` file next to this one.
      HOST_LAN_IP: ${HOST_LAN_IP:-}
      # Set by the host in `.env` before starting — see `.env.sample`. The
      # server refuses to start without a password of at least 4 characters.
      WORKSPACE_NAME: ${WORKSPACE_NAME:-}
      WORKSPACE_PASSWORD: ${WORKSPACE_PASSWORD:-}
      # Both are addresses on the compose network, and they point opposite ways.
      # The first is Yorkie as this container reaches it; the second is *this
      # container as Yorkie reaches it*, which is why neither can be localhost —
      # inside a container that means the container itself.
      #
      # Startup writes the webhook URL onto Yorkie's project and refuses to serve
      # if it cannot, because a Yorkie nobody told to check tokens accepts every
      # client on the LAN.
      YORKIE_ADMIN_ADDR: http://yorkie:8080
      YORKIE_AUTH_WEBHOOK_URL: http://app:3000/api/internal/yorkie/auth
    depends_on:
      - yorkie

  yorkie:
    image: yorkieteam/yorkie:0.7.13
    container_name: rmf-yorkie
    # Yorkie owns document persistence and version history (ADR-002), so it runs
    # against MongoDB rather than its in-memory MemDB. Without this flag every
    # document and revision is lost on restart, and there is no other durable
    # store. `--mongo-yorkie-database` defaults to `yorkie-meta`, so the URI
    # needs no database suffix.
    command: ["server", "--mongo-connection-uri", "mongodb://mongo:27017"]
    # Yorkie exits(1) if it cannot ping Mongo at startup — it is fail-fast, not
    # lazily initialized. Plain `depends_on` only orders startup, so Yorkie could
    # lose the race to Mongo's first accepting connection and crash-loop; waiting
    # for Mongo to report healthy removes that race at the source.
    #
    # Yorkie itself gets no healthcheck: its image carries no curl, wget, nc, and
    # its shell has no /dev/tcp, so nothing in the container can probe port 8080.
    # Without one, `docker compose up --wait yorkie` reports it healthy the moment
    # it is running — measured: with a bad Mongo URI, `--wait` still exits 0 while
    # the container is crash-looping. So `running` is not proof of anything here,
    # and CI probes the health endpoint from outside instead.
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"

  mongo:
    # Pinned rather than `latest` (which Yorkie's example uses) so a new major
    # cannot land silently between two runs of the same compose file.
    image: mongo:8
    container_name: rmf-mongo
    # `--quiet` drops the per-connection accepted/ended lines, which are most of
    # the volume: Yorkie opens a pool and reconnects on a timer, so an idle stack
    # still produces a steady stream of them.
    command: ["mongod", "--quiet"]
    # Keeps `docker compose up` readable. The host's terminal is where the join
    # address is printed, and hundreds of storage-engine lines scroll it away
    # before anyone can read it. Nothing is lost — `docker compose logs mongo`
    # still has everything.
    attach: false
    restart: unless-stopped
    # No published port: only Yorkie talks to it, over the compose network. This
    # runs on an open campus LAN, so an exposed unauthenticated database would
    # be reachable by anyone on the subnet.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongo-data:
  app-data:
