name: Doc reminders comment

# Stage 2 of 2. Runs main's code with a write token, so it never checks out or
# runs PR code, and it posts nothing the fork wrote: the only thing taken from
# the artifact is a PR number, validated below. The comment body is rendered
# here from main's ownership map and the PR's file list, read from the API.
on:
  workflow_run:
    workflows: ["Doc reminders"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doc-reminders
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # A number, for a PR whose head is the commit stage 1 ran on. A later push
      # makes this run stale: skip quietly, the newer run will comment.
      - id: pr
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const number = require("fs").readFileSync("artifact/pr-number", "utf8").trim();
            if (!/^[0-9]{1,9}$/.test(number)) throw new Error("bad PR number");
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(number) });
            if (pr.head.sha !== process.env.HEAD_SHA) {
              core.info(`PR #${number} has moved past ${process.env.HEAD_SHA}; skipping.`);
              return;
            }
            core.setOutput("number", number);

      - if: steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - if: steps.pr.outputs.number != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Old and new path of a rename both count, like a local --no-renames diff.
      - if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          node scripts/owning-docs.mjs --changed "$RUNNER_TEMP/changed.txt" --out "$RUNNER_TEMP/body.md"

      - if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        env:
          PR: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const body = require("fs").readFileSync(`${process.env.RUNNER_TEMP}/body.md`, "utf8");
            const MARKER = "<!-- owning-docs-reminder -->";
            const issue_number = Number(process.env.PR);
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const mine = comments.find((c) => c.user.login === "github-actions[bot]" && c.body.startsWith(MARKER));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else if (!body.includes("Nothing to remind")) {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
