name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      # The token the default checkout leaves in .git/config is of no use to
      # `pnpm build`, so do not leave it there. `fetch-depth: 0` because the SRS
      # sync step below needs the merge base to see what this PR changed.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # docs/SRS-en.md must mirror docs/SRS-ko.md (#131). Stdlib only, so it
      # runs before the install and fails fast.
      - run: node scripts/verify-srs-sync.mjs --strict

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Doc drift and the comment budget, in one job. Neither is a required check:
  # verify docs stays non-blocking until it has run green for a while (then a
  # ruleset change, by an admin), and the comment budget only flags a PR
  # (docs/conventions.md). The scripts are stdlib-only, but AGENTS.md links into
  # node_modules/next/dist/docs/, which verify-docs reports dead without an
  # install. Full history: verify-srs-sync and the budget both diff against the
  # merge base, which a shallow clone does not have.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/verify-docs.mjs
      - run: node scripts/verify-doc-refs.mjs
      - run: node scripts/verify-srs-sync.mjs --strict
      - run: node scripts/verify-srs-refs.mjs
      - run: node scripts/verify-declarations.mjs
      - run: node scripts/gen-endpoints.mjs --check
      - run: node scripts/sync-skills.mjs --check

      # Fails only a file this PR pushed over the budget. Runs even when a doc
      # check above failed — the two answer different questions.
      - name: Comment budget
        if: ${{ !cancelled() }}
        run: node scripts/comment-budget.mjs --strict

  # Everything that needs the real stack, on one stack: the Yorkie invariants,
  # the container smoke test, then the E2E layer. The job keeps the smoke test's
  # name because that is the required check the branch ruleset names.
  container:
    name: container smoke test
    runs-on: ubuntu-latest
    env:
      # The server refuses to start without one (lib/workspace-config.ts), and
      # there is no .env here. Also what the join assertions below type in.
      WORKSPACE_PASSWORD: ci-smoke-test
    # A container that accepts the connection but never answers would otherwise
    # hold a runner for the 6h default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Yorkie owns document persistence against MongoDB (ADR-002). A bad URI or
      # flag fails here instead of silently falling back to MemDB and losing
      # every document on the next restart. Mongo comes along via yorkie's
      # depends_on. `--wait` returns once compose's healthcheck passes; the probe
      # asserts from the runner's side of the network, where a published-port or
      # binding problem would show and a healthcheck inside the container would not.
      - name: Verify Yorkie is serving against MongoDB
        shell: bash
        run: |
          set -uo pipefail
          docker compose up -d --wait yorkie
          for _ in $(seq 1 30); do
            if curl -sf -m 5 -X POST http://localhost:8080/grpc.health.v1.Health/Check \
                 -H 'Content-Type: application/json' -d '{}' \
                 | grep -q SERVING_STATUS_SERVING; then
              echo "Yorkie is serving"; exit 0
            fi
            sleep 2
          done
          echo "::error::Yorkie never reported SERVING — check the MongoDB wiring"
          docker compose logs mongo yorkie
          exit 1

      # The SDK measurements ADR-007 rests on (#42). Reported by the last step,
      # so a failure here does not hide what the smoke test would have said.
      - name: Yorkie invariants
        id: invariants
        continue-on-error: true
        run: node scripts/verify-yorkie-invariants.mjs

      - name: Build and start the image the host runs
        run: docker compose up -d --build app

      # `register()` lands a few seconds after Next prints "Ready", so wait for
      # the banner itself rather than for the port.
      - name: Wait for the startup banner
        shell: bash
        run: |
          set -uo pipefail
          for _ in $(seq 1 60); do
            if docker compose logs app | grep -q 'Host:  http'; then exit 0; fi
            sleep 2
          done
          echo "::error::server never printed the host link"
          docker compose logs app
          exit 1

      # The two bugs this task shipped past `pnpm dev` — a redirect to
      # http://0.0.0.0:3000/ that dropped the cookie, and an empty HOST_LAN_IP
      # printing "http://:3000" — were only visible from in here.
      - name: The printed link grants host, everything else is a guest
        shell: bash
        run: |
          set -euo pipefail

          # `|| true` so a missing secret reaches the check below instead of
          # dying inside the pipeline under `pipefail`.
          secret=$(docker compose logs app | grep -o 'secret=[a-z0-9-]*' | tail -1 | cut -d= -f2 || true)
          [ -n "$secret" ] || { echo "::error::no secret in the startup banner"; exit 1; }

          assert_body() {
            if ! grep -q "$2" <<<"$1"; then
              echo "::error::$3"
              exit 1
            fi
          }

          # `/` used to answer `hello host!`. It is the workspace home now, and the
          # host and a guest see the same shell — what separates them is that the
          # host got in at all, and the identity the page hands its presence
          # provider. Both are in the server-rendered HTML. The shell's marker is
          # the sidebar tree's search field, which only the workspace renders.
          host_home=$(curl -sS --connect-timeout 5 --max-time 10 -c jar.txt -L "http://localhost:3000/api/auth/host?secret=$secret")
          assert_body "$host_home" \
            '문서 제목 검색' 'the printed host link did not grant host'
          assert_body "$host_home" \
            'Host' 'the host reached the workspace but not as the host'

          # The workspace is password-gated now (FR-020-03/04), so a visitor
          # with no session lands on the join screen rather than inside.
          assert_body "$(curl -sS --connect-timeout 5 --max-time 10 -L http://localhost:3000/)" \
            'autoComplete="nickname"' 'a visitor with no session was not sent to the join screen'

          assert_body "$(curl -sS --connect-timeout 5 --max-time 10 -c wrong.txt -L 'http://localhost:3000/api/auth/host?secret=wrong')" \
            'autoComplete="nickname"' 'a wrong secret granted host'

          # A wrong password must not get in, and must not say which field was
          # wrong — that would confirm nicknames to a stranger.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 \
            -X POST http://localhost:3000/api/workspace/join \
            -H 'Content-Type: application/json' \
            -d '{"nickname":"ci-guest","password":"not-the-password"}')
          [ "$code" = 401 ] || { echo "::error::a wrong workspace password returned $code, not 401"; exit 1; }

          curl -sS --connect-timeout 5 --max-time 10 -c guest.txt \
            -X POST http://localhost:3000/api/workspace/join \
            -H 'Content-Type: application/json' \
            -d "{\"nickname\":\"ci-guest\",\"password\":\"$WORKSPACE_PASSWORD\"}" >/dev/null

          guest_home=$(curl -sS --connect-timeout 5 --max-time 10 -b guest.txt http://localhost:3000/)
          assert_body "$guest_home" \
            '문서 제목 검색' 'the workspace password did not get a guest in'
          assert_body "$guest_home" \
            'ci-guest' 'the guest reached the workspace under the wrong name'

          # Chat is session-gated, and the sender comes from that session rather
          # than the request body. Both were true of nothing until recently:
          # this module shipped before guest login and took `sender` from the
          # body with no session check at all.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 \
            -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"sender":"someone-else","text":"posted with no session"}')
          [ "$code" = 401 ] || { echo "::error::posting chat with no session returned $code, not 401"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 10 \
            http://localhost:3000/api/chat)
          [ "$code" = 401 ] || { echo "::error::reading chat history with no session returned $code, not 401"; exit 1; }

          # The body names a different sender on purpose: the stored message must
          # say who the session is, not who the request claimed to be.
          sent=$(curl -sS --connect-timeout 5 --max-time 10 -b guest.txt \
            -X POST http://localhost:3000/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"sender":"impersonated","text":"hello from ci"}')
          assert_body "$sent" 'ci-guest' 'the message was not attributed to the session'
          case "$sent" in
            *impersonated*) echo "::error::the body's sender was trusted over the session"; exit 1 ;;
          esac

          # The join address must never come out empty (compose passes
          # HOST_LAN_IP through as "" when it is unset).
          if docker compose logs app | grep -q 'Guest: http://:'; then
            echo "::error::guest join address printed with no host"
            exit 1
          fi

          echo "host/guest split, the join flow, and chat attribution verified against the container"

      # The E2E layer (docs/testing.md), against the same container. Nothing from
      # here on can fail this required job until E2E has run green for a while.
      - name: Install Chromium
        id: browsers
        continue-on-error: true
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        id: e2e
        if: ${{ steps.browsers.outcome == 'success' }}
        continue-on-error: true
        env:
          E2E_WORKSPACE_PASSWORD: ${{ env.WORKSPACE_PASSWORD }}
        run: pnpm e2e

      - name: E2E report
        if: ${{ steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

      - name: Server log
        if: always()
        run: docker compose logs app yorkie

      - name: Fail on the Yorkie invariants
        if: ${{ steps.invariants.outcome == 'failure' }}
        run: |
          echo "::error::scripts/verify-yorkie-invariants.mjs failed — see its step above"
          exit 1
